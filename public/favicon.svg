<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Dark themed container circle -->
  <rect width="100" height="100" rx="20" fill="#0B0F19" />
  <!-- Neon stroke border -->
  <rect x="3" y="3" width="94" height="94" rx="17" fill="none" stroke="url(#grad)" stroke-width="4" opacity="0.8" />
  <!-- Aakanksha Wagh Dev initials -->
  <text x="50" y="62" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#grad)" text-anchor="middle" letter-spacing="-1">AW</text>
